  .soon-card{max-width:520px; margin:36px auto; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:38px 24px; box-shadow:var(--shadow)}
  .soon-ic{display:inline-flex; width:84px; height:84px; border-radius:24px; align-items:center; justify-content:center; background:color-mix(in srgb, var(--pacc) 16%, transparent); color:var(--pacc)}
  .soon-ic svg{width:48px; height:48px}
  .soon-tag{display:table; margin:16px auto 0; padding:4px 13px; border-radius:999px; border:1px solid var(--pacc); color:var(--pacc); font-size:12px; font-weight:800}
  .soon-card h1{margin:10px 0 6px; font-size:27px; font-weight:900}
  .soon-card p{color:var(--muted); line-height:1.75; margin:0 0 20px; font-size:14.5px}

  /* ---------- FLOATING DOCK — liquid glass (reel style 01) ---------- */
  .dock-wrap{position:fixed; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:80;
    display:flex; justify-content:center; pointer-events:none; padding:0 10px}
  .dock{pointer-events:auto; position:relative; display:flex; align-items:stretch; gap:1px;
    max-width:100%; overflow-x:auto; scrollbar-width:none; padding:7px 8px;
    border-radius:30px; border:1px solid rgba(255,255,255,.16);
    background:linear-gradient(165deg, color-mix(in srgb, var(--dockbg) 100%, transparent), var(--dockbg));
    backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
    box-shadow:0 22px 50px rgba(3,0,16,.55), 0 0 34px rgba(212,175,55,.16),
      inset 0 1px 0 rgba(255,255,255,.28), inset 0 -10px 22px rgba(212,175,55,.10)}
  .dock::-webkit-scrollbar{display:none}
  .dock-blob{position:absolute; top:6px; height:calc(100% - 12px); left:0; width:52px; z-index:0;
    border-radius:21px; opacity:0;
    background:linear-gradient(150deg, rgba(250,230,160,.55), rgba(212,175,55,.32) 70%);
    border:1px solid rgba(255,255,255,.38);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -6px 14px rgba(212,175,55,.3), 0 8px 24px rgba(212,175,55,.3);
    transition:left .55s cubic-bezier(.3,1.35,.35,1), width .55s cubic-bezier(.3,1.35,.35,1), opacity .25s}
  .dock-blob.noanim{transition:none}
  .dbtn{position:relative; z-index:1; flex:1 0 auto; min-width:44px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:5px 4px 6px; background:none; border:0; border-radius:21px; cursor:pointer; color:var(--muted2); font-family:inherit}
  .dbtn .pic{display:flex; transition:transform .3s}
  .dbtn svg{width:24px; height:24px; display:block; filter:grayscale(1); opacity:.5; transition:filter .3s, opacity .3s}
  .dbtn .pl{font-size:9.5px; font-weight:700; line-height:1.15; white-space:nowrap; color:var(--muted2); transition:color .3s}
  .dbtn.on svg{filter:none; opacity:1}
  .dbtn.on .pl{color:var(--text); font-weight:800}
  /* dock icons: device pictograms — grey until selected, true detail when on (owner reference 2026-10-31) */
  .dbtn .pic{height:26px; align-items:center; justify-content:center}
  .dbtn[data-pb="vita"] svg, .dbtn[data-pb="psp"] svg{width:38px; height:19px}
  .dkbody{fill:#5f646e}
  .dkmark{fill:#5f646e}
  .dkscreen{fill:var(--knock)}
  .dbtn.on .dkbody, .spchip.on .dkbody{fill:#23211d}
  .dbtn.on .dkscreen, .spchip.on .dkscreen, .shelf-ic .dkscreen{fill:#e9e2cd}
  .dbtn.on g.dkmark, .spchip.on g.dkmark, .shelf-ic g.dkmark{fill:#0070D1}
  .dbtn.on text.dkmark, .spchip.on text.dkmark, .shelf-ic text.dkmark{fill:#23211d}
  body[data-dock="01"] .dock-blob{background:linear-gradient(165deg,#f8e6b0,#eed086 55%,#e3c476);
    border:1px solid #d9a441;
    box-shadow:inset 0 1px 0 #fff8e1, inset 0 -8px 16px rgba(180,130,40,.35), 0 10px 26px rgba(212,175,55,.4)}
  body[data-dock="01"] .dbtn.on .pl{color:var(--selpl,#221a08)}
  .dbtn:active .pic{transform:scale(.88)}

  /* ---------- MORE SHEET — glass ---------- */
  .scrim{position:fixed; inset:0; background:rgba(4,1,14,.6); backdrop-filter:blur(3px); z-index:90;
    opacity:0; pointer-events:none; transition:opacity .3s}
  body.sheet-open .scrim{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:50%; bottom:0; transform:translate(-50%,106%); z-index:95;
    width:min(560px,100vw); max-height:88dvh; overflow-y:auto; overscroll-behavior:contain;
    border-radius:28px 28px 0 0; border:1px solid rgba(255,255,255,.16); border-bottom:0;
    background:var(--sheetbg); backdrop-filter:blur(26px) saturate(160%); -webkit-backdrop-filter:blur(26px) saturate(160%);
    box-shadow:0 -18px 60px rgba(3,0,16,.5), inset 0 1px 0 rgba(255,255,255,.25);
    padding:8px 18px calc(20px + env(safe-area-inset-bottom));
    transition:transform .5s cubic-bezier(.3,1.12,.3,1)}
  body.sheet-open .sheet{transform:translate(-50%,0)}
  .grip{width:44px; height:5px; border-radius:99px; background:var(--line2); margin:6px auto 10px}
  .sheet-head{display:flex; align-items:center; gap:10px; margin-bottom:4px}
  .sheet-head .st{font-size:19px; font-weight:900}
  .sheet-head .x{margin-inline-start:auto; width:34px; height:34px; border-radius:50%; border:1px solid var(--line2);
    background:var(--panel); color:var(--text); cursor:pointer; font-size:14px}
  .sheet-note{font-size:12.5px; color:var(--muted2); margin:0 0 6px; line-height:1.6}
  .sheet-sec{margin-top:16px}
  .sheet-sec h4{margin:0 0 9px; font-size:11.5px; font-weight:800; letter-spacing:1.8px; color:var(--muted)}
  .sheet-plats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .spchip{display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 4px 9px; border-radius:16px;
    border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer; font-family:inherit}
  .spchip svg{width:27px; height:27px; filter:grayscale(1); opacity:.55}
  .spchip span{font-size:10.5px; font-weight:800; white-space:nowrap}
  .spchip.on{border-color:var(--acc); color:var(--text)}
  .spchip.on svg{filter:none; opacity:1}
  .spchip:active{transform:scale(.95)}
  .sheet-list{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  @media (max-width:420px){ .sheet-list{grid-template-columns:1fr} }
  .sitem{display:flex; align-items:center; gap:9px; padding:12px 13px; border-radius:14px; text-align:start;
    border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit}
  .sitem .cnt{margin-inline-start:auto; font-size:11px; font-weight:900; color:var(--acc2)}
  .sitem:active{transform:scale(.97)}
  .sheet-cta{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .cta{display:flex; align-items:center; justify-content:center; gap:8px; padding:14px 10px; border-radius:15px;
    font-size:14.5px; font-weight:900; cursor:pointer; border:0; font-family:inherit; color:#fff; text-align:center}
  .cta.svc{background:linear-gradient(140deg,var(--acc),var(--acc2)); color:#171106; box-shadow:0 8px 22px rgba(212,175,55,.3)}
  .cta.wa{background:var(--wa); color:#0b2417}
  .cta:active{transform:scale(.97)}
  .sheet-toggles{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .tgl{padding:12px 10px; border-radius:14px; border:1px solid var(--line2); background:var(--panel);
    color:var(--text); font-size:13.5px; font-weight:800; cursor:pointer; font-family:inherit}
  .tgl:active{transform:scale(.97)}
  .sheet-legal{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:18px}
  .sheet-legal a{font-size:12.5px; font-weight:700; color:var(--muted); border:1px solid var(--line);
    padding:7px 14px; border-radius:999px; cursor:pointer; background:var(--panel)}
  /* handheld glyphs (PSP/Vita) — lift body tone so they read on glass */
  .dbtn[data-pb="psp"] svg path:first-of-type,.dbtn[data-pb="vita"] svg path:first-of-type,
  .spchip[data-sp="psp"] .dkbody,.spchip[data-sp="vita"] .dkbody{fill:#83838d}

  /* ================= FOCUSED — identity / stage / stats / PTR / dock gallery ================= */
  /* per-game cover identity: cards glow with their own cover colour (--gc) */
  .card{--gc:var(--acc)}
  .card .cbody{border-top:2px solid color-mix(in srgb, var(--gc) 55%, transparent)}
  .card:hover{border-color:color-mix(in srgb, var(--gc) 70%, transparent);
    box-shadow:0 18px 44px color-mix(in srgb, var(--gc) 38%, transparent)}
  .block h2{font-size:clamp(23px,6.4vw,31px)}
  .mascot-big svg{width:56px; height:56px}

  /* ---------- hero stage — #1 game, huge type over its art ---------- */
  .stage{--gc:#d4af37; position:relative; margin:0 -16px; padding:20px 16px 26px; overflow:hidden;
    border-radius:0 0 28px 28px;
    background:
      radial-gradient(120% 130% at 88% -10%, color-mix(in srgb, var(--gc) 58%, transparent), transparent 62%),
      linear-gradient(160deg, color-mix(in srgb, var(--gc) 36%, #0a0618), #07040f 80%)}
  body.light .stage{
    background:
      radial-gradient(120% 130% at 88% -10%, color-mix(in srgb, var(--gc) 42%, transparent), transparent 62%),
      linear-gradient(160deg, color-mix(in srgb, var(--gc) 30%, #ffffff), var(--bg2) 82%)}
  .stage-mono{position:absolute; inset-inline-end:-10px; top:-46px; font-family:Georgia,serif; font-weight:700;
    font-size:238px; line-height:1; color:rgba(255,255,255,.13); user-select:none; pointer-events:none}
  .stage-brand{position:absolute; top:14px; inset-inline-end:16px; z-index:2; display:flex; align-items:center; gap:9px}
  .stage-mascot svg{width:47px; height:47px; display:block; filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
  .stage-in{position:relative; z-index:1; max-width:660px}
  .stage-kick{font-size:11.5px; font-weight:800; letter-spacing:3.5px; color:var(--acc2)}
  .stage-feat{display:inline-block; margin-top:13px; font-size:10.5px; font-weight:900; letter-spacing:2px;
    color:#171106; background:linear-gradient(90deg,#f5c518,#ffdc66); padding:4px 11px; border-radius:999px;
    box-shadow:0 6px 16px rgba(245,197,24,.35)}
  .stage-title{margin:11px 0 0; font-size:clamp(40px,11.5vw,68px); font-weight:900; line-height:.99;
    letter-spacing:-.01em; color:#fff; text-shadow:0 12px 36px rgba(0,0,0,.55)}
  body.light .stage-title{color:#17102b; text-shadow:0 8px 26px rgba(255,255,255,.35)}
  .stage-title2{font-size:clamp(19px,5.4vw,27px); font-weight:800; color:var(--muted); margin-top:7px}
  .stage-chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:17px}
  .schip{background:rgba(5,2,16,.5); border:1px solid rgba(255,255,255,.28); color:#fff; backdrop-filter:blur(4px);
    font-size:12px; font-weight:800; padding:5px 11px; border-radius:999px}
  .schip b{color:#ffd95e}
  body.light .schip{background:rgba(255,255,255,.55); color:#241a45; border-color:rgba(30,16,70,.25)}
  body.light .schip b{color:#8a5a00}
  .stage-cta{margin-top:21px; border:0; cursor:pointer; color:#fff; font-family:inherit; font-weight:900;
    font-size:16.5px; padding:15px 30px; border-radius:999px;
    background:linear-gradient(120deg, var(--gc), var(--acc2));
    box-shadow:0 14px 34px color-mix(in srgb, var(--gc) 55%, transparent)}
  .stage-cta:active{transform:scale(.97)}

  /* ---------- real-numbers stats strip ---------- */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0 0}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 5px 10px;
    text-align:center; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
  .stat .sv{font-size:clamp(19px,5.6vw,26px); font-weight:900; font-variant-numeric:tabular-nums;
    background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .stat .sl{font-size:10.5px; font-weight:700; color:var(--muted); margin-top:2px; letter-spacing:.3px}

  /* ---------- liquid pull-to-refresh droplet ---------- */
  #ptr{position:fixed; top:0; left:50%; margin-left:-19px; width:38px; height:38px; z-index:130;
    pointer-events:none; opacity:0; will-change:transform}
  #ptr .drop{width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-weight:700; font-size:17px; color:#171106;
    background:radial-gradient(120% 120% at 32% 26%, rgba(255,240,190,.98), rgba(212,175,55,.92) 55%, rgba(150,116,32,.95));
    border:1px solid rgba(255,255,255,.5); border-radius:52% 48% 55% 45% / 58% 56% 44% 42%;
    box-shadow:inset 0 2px 5px rgba(255,255,255,.55), inset 0 -6px 10px rgba(120,90,20,.45), 0 10px 22px rgba(120,90,20,.4)}

  /* ---------- dock gallery — sheet list ---------- */
  .sheet-docks{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .ditem{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:14px; text-align:start;
    border:1px solid var(--line); background:var(--panel); color:var(--text);
    font-size:13px; font-weight:700; cursor:pointer; font-family:inherit}
  .ditem .num{font-weight:900; color:var(--acc2); font-size:11.5px; border:1px solid var(--line2);
    border-radius:8px; padding:2.5px 7px; font-variant-numeric:tabular-nums}
  .ditem.on{border-color:var(--acc); background:color-mix(in srgb, var(--acc) 16%, transparent)}
  .ditem:active{transform:scale(.96)}

  /* ---------- dock styles 02–10 (01 = base liquid glass above) ---------- */
  /* 02 Magnetic — snapping solid pill, fast spring */
  body[data-dock="02"] .dock{box-shadow:0 18px 44px rgba(3,0,16,.5), inset 0 1px 0 rgba(255,255,255,.2)}
  body[data-dock="02"] .dock-blob{background:linear-gradient(140deg,var(--acc),var(--acc2));
    border-color:rgba(255,255,255,.25); box-shadow:0 8px 22px rgba(212,175,55,.4);
    transition:left .24s cubic-bezier(.25,1.35,.35,1), width .24s cubic-bezier(.25,1.35,.35,1), opacity .2s}
  /* 03 Glass Capsule — frosted pastel capsule, soft white indicator */
  body[data-dock="03"] .dock{border-radius:999px; border-color:rgba(255,255,255,.45);
    background:linear-gradient(165deg, rgba(255,255,255,.32), rgba(255,255,255,.12));
    box-shadow:0 20px 46px rgba(60,30,120,.35), inset 0 1px 0 rgba(255,255,255,.6)}
  body.light[data-dock="03"] .dock{background:linear-gradient(165deg, rgba(255,255,255,.78), rgba(255,255,255,.45))}
  body[data-dock="03"] .dock-blob{background:rgba(255,255,255,.88); border-color:#ffffff;
    box-shadow:0 6px 18px rgba(120,95,30,.25), inset 0 1px 0 #fff}
  /* 04 Segmented Dynamic — inset track, sliding segment */
  body[data-dock="04"] .dock{gap:3px; padding:5px; border-radius:20px;
    background:color-mix(in srgb, var(--bg2) 88%, transparent);
    box-shadow:inset 0 2px 10px rgba(0,0,0,.35), 0 18px 40px rgba(3,0,16,.45)}
  body[data-dock="04"] .dock-blob{top:5px; height:calc(100% - 10px); border-radius:13px;
    background:var(--panel2); border:1px solid var(--line2); box-shadow:0 4px 14px rgba(0,0,0,.3)}
  body[data-dock="04"] .dbtn{border-radius:13px}
  /* 05 Orbit — ring + rotating satellites around the selected icon */
  body[data-dock="05"] .dock-blob{top:calc(50% - 24px); height:48px; border-radius:50%;
    background:transparent; border:2px solid var(--acc2);
    box-shadow:0 0 14px rgba(212,175,55,.35), inset 0 0 10px rgba(212,175,55,.18)}
  body[data-dock="05"] .dock-blob .orb{position:absolute; inset:-2px; animation:orbSpin 5.5s linear infinite}
  body[data-dock="05"] .dock-blob .orb i{position:absolute; width:7px; height:7px; border-radius:50%;
    background:var(--acc2); box-shadow:0 0 8px var(--acc2)}
  body[data-dock="05"] .dock-blob .orb .d1{top:-4.5px; left:calc(50% - 3.5px)}
  body[data-dock="05"] .dock-blob .orb .d2{bottom:-4.5px; left:calc(50% - 3.5px); background:var(--acc); box-shadow:0 0 8px var(--acc)}
  @keyframes orbSpin{to{transform:rotate(360deg)}}
  /* 06 Wave Indicator — an SVG crest travelling under the selected icon */
  body[data-dock="06"] .dock-blob{top:auto; bottom:1px; height:14px; background:none; border:0;
    box-shadow:none; color:var(--acc2)}
  body[data-dock="06"] .dock-blob svg{width:100%; height:100%; display:block; animation:waveBob 2.6s ease-in-out infinite}
  @keyframes waveBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  /* 07 Cyber Neon — dark dock, neon ring + scanlines */
  body[data-dock="07"] .dock{background:rgba(2,6,14,.85); border-color:rgba(34,211,238,.5);
    box-shadow:0 0 24px rgba(34,211,238,.28), 0 22px 50px rgba(0,0,0,.6), inset 0 0 18px rgba(34,211,238,.08)}
  body[data-dock="07"] .dock-blob{
    background:repeating-linear-gradient(0deg, rgba(34,211,238,.16) 0 2px, rgba(34,211,238,.05) 2px 4px);
    border:1.5px solid #22d3ee; box-shadow:0 0 16px rgba(34,211,238,.55), inset 0 0 12px rgba(34,211,238,.35)}
  body[data-dock="07"] .dbtn.on svg{filter:drop-shadow(0 0 6px rgba(34,211,238,.85))}
  /* 08 Morphing Blob — organic wobbling indicator */
  body[data-dock="08"] .dock-blob{
    background:linear-gradient(150deg, rgba(245,215,110,.55), rgba(212,175,55,.4));
    border-color:rgba(255,255,255,.4);
    border-radius:58% 42% 55% 45% / 52% 55% 45% 48%;
    animation:blobMorph 4.2s ease-in-out infinite}
  @keyframes blobMorph{
    0%,100%{border-radius:58% 42% 55% 45% / 52% 55% 45% 48%}
    33%{border-radius:45% 55% 48% 52% / 58% 44% 56% 42%}
    66%{border-radius:52% 48% 42% 58% / 45% 58% 42% 55%}}
  /* 09 Layered Card — selected card lifts, deep stacked shadow */
  body[data-dock="09"] .dock-blob{top:3px; height:calc(100% - 6px); border-radius:16px;
    background:var(--panel2); border:1px solid var(--line2);
    box-shadow:0 12px 24px rgba(3,0,16,.5), 0 26px 30px -8px rgba(3,0,16,.4)}
  body[data-dock="09"] .dbtn{transition:transform .35s cubic-bezier(.3,1.3,.35,1)}
  body[data-dock="09"] .dbtn.on{transform:translateY(-5px)}
  /* 10 Minimal Luxury — thin gold-line dock, serif labels, hairline indicator */
  body[data-dock="10"] .dock{background:color-mix(in srgb, var(--bg) 80%, transparent);
    border:1px solid #c9a227; border-radius:16px;
    box-shadow:0 18px 40px rgba(3,0,16,.4), inset 0 1px 0 rgba(201,162,39,.35);
    backdrop-filter:blur(14px) saturate(130%); -webkit-backdrop-filter:blur(14px) saturate(130%)}
  body[data-dock="10"] .dock-blob{top:auto; bottom:6px; height:2px; border-radius:2px; border:0;
    background:linear-gradient(90deg,#a8821f,#f5d76e,#a8821f); box-shadow:0 0 8px rgba(245,215,110,.5);
    transition:left .45s ease, width .45s ease, opacity .25s}
  body[data-dock="10"] .dbtn .pl{font-family:Georgia,serif; letter-spacing:.4px}
  body[data-dock="10"] .dbtn.on .pl{color:#c9a227}

  @media (prefers-reduced-motion: reduce){
    body[data-dock="05"] .dock-blob .orb{animation:none}
    body[data-dock="06"] .dock-blob svg{animation:none}
    body[data-dock="08"] .dock-blob{animation:none}
  }
  /* ================= PSPKG-SPIRIT — reference chrome ================= */
  .ticker{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:14px 0 0;
    border:1px solid var(--line2); border-radius:12px; padding:10px 14px; font-size:13px; font-weight:700;
    background:linear-gradient(120deg, color-mix(in srgb, var(--acc) 16%, transparent), transparent 70%)}
  .ticker a{color:var(--acc2); font-weight:900; white-space:nowrap}
  .demo-tag{font-style:normal; display:inline-block; background:#f5c518; color:#171106; font-size:8.5px;
    font-weight:900; letter-spacing:.7px; padding:1.5px 5px; border-radius:5px; margin-inline-start:5px; vertical-align:2px}
  .vall{margin-inline-start:auto; font-size:13px; font-weight:900; color:var(--acc2); cursor:pointer; letter-spacing:.2px}
  .vall:active{opacity:.6}
  .badge.upd{background:linear-gradient(120deg,#a8821f,#f5d76e); color:#171106}
  body[data-dock="02"] .dbtn.on .pl{color:#171106}
  .publine{color:var(--muted2); font-size:12.5px; font-weight:700; margin:0 0 6px}
  .gstats{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 2px}
  .gstat{display:inline-flex; flex-direction:column; gap:1px; background:var(--panel2); border:1px solid var(--line);
    border-radius:12px; padding:8px 13px}
  .gstat .n{font-size:17px; font-weight:900; font-variant-numeric:tabular-nums}
  .gstat .l{font-size:10px; color:var(--muted); font-weight:800; letter-spacing:.8px}

function gameColor(g){
  if (COLOR_CACHE[g.id]) return COLOR_CACHE[g.id];
  let c = GAME_COLORS[g.id];
  if (!c){ let h = 0; for (const ch of g.id) h = (h*31 + ch.charCodeAt(0)) >>> 0; c = "hsl(" + (h % 360) + ",58%,40%)"; }
  COLOR_CACHE[g.id] = c; return c;

function sampleCoverColor(g){
  if (!g.cover || COLOR_TRIED[g.id]) return;
  COLOR_TRIED[g.id] = 1;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => { try{
    const cv = document.createElement("canvas"); cv.width = 24; cv.height = 24;
    const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, 24, 24);
    const px = cx.getImageData(0, 0, 24, 24).data;
    let r = 0, gg = 0, b = 0, n = 0;
    for (let i = 0; i < px.length; i += 16){
      if (px[i+3] < 200) continue;
      const mx = Math.max(px[i], px[i+1], px[i+2]), mn = Math.min(px[i], px[i+1], px[i+2]);
      if (mx < 28 || (mx > 242 && mn > 200)) continue;
      r += px[i]; gg += px[i+1]; b += px[i+2]; n++;
    }
    if (!n) return;
    const col = "rgb(" + Math.round(r/n) + "," + Math.round(gg/n) + "," + Math.round(b/n) + ")";
    COLOR_CACHE[g.id] = col;
    try{ const all = JSON.parse(localStorage.getItem("pkgColors") || "{}");
      all[g.id] = col; localStorage.setItem("pkgColors", JSON.stringify(all)); }catch(e){}
    document.querySelectorAll('[data-open="' + g.id + '"]').forEach(el => {
      el.style.setProperty("--gc", col);
      const cvEl = el.querySelector(".cover"); if (cvEl) cvEl.style.cssText = coverStyle(g);
    });
  }catch(e){} };
  img.src = g.cover;
}

/* Seeded demo engagement stats — deterministic per game id. Placeholder

   (sizes, versions, CUSA, library counts) is never tagged. */
const _dsCache = {};
function demoStats(g){
  if (_dsCache[g.id]) return _dsCache[g.id];
  let h = 7;
  for (const ch of g.id) h = (h * 33 + ch.charCodeAt(0)) >>> 0;
  const rating = Math.round((3.1 + (h % 20) / 10) * 10) / 10;
  const rc = 40 + (h % 860);
  const views = 900 + ((h * 7919) % 240000);
  const downloads = Math.round(views * (1.4 + (h % 10) / 10));
  const d5 = 48 + (h % 25);
  const d4 = Math.round((100 - d5) * 0.55);
  const d3 = Math.round((100 - d5 - d4) * 0.6);
  const d2 = Math.round((100 - d5 - d4 - d3) * 0.55);
  const d1 = 100 - d5 - d4 - d3 - d2;
  const _out = { rating: rating, rc: rc, views: views, downloads: downloads, dist: [d5, d4, d3, d2, d1] };
  _dsCache[g.id] = _out; return _out;
}

   edition headings from exactly those pages; HTTP 200 re-verified today for
   all four sections. Non-PSPKG sources keep their listing URL (their
   listing page carries the download entry itself). */
const DL_RE = /^(https:\/\/pspkg\.com\/(?:ps4|arabic-games|ps3|ps5)\/)(?!download-)([^\/]+\.html)$/;
function dlDest(url){ if (!url) return url; return String(url).replace(DL_RE, "$1download-$2"); }
/* ONE Clk.sh hop. Template + token come from site-config.js (SITE_CFG).
   With no token configured the hop is OFF and the raw destination is used —
   downloads keep working, they just don't earn yet. */
function hopURL(dest){
  const tpl = SITE_CFG.hopTemplate || "", tok = SITE_CFG.clkToken || "";
  if (!tpl || !tok) return dest;
  return tpl.split("{token}").join(encodeURIComponent(tok)).split("{url}").join(encodeURIComponent(dest));
}
function isArabicEd(g){ return (g.files||[]).some(f => f.kind === "game_ar" || /arabic/i.test(f.kind_label_en||"")); }
function fwChip(g){
  if (g.min_fw == null) return '<span class="chip fwok">' + esc(t("fwUnknown")) + '</span>';
  return '<span class="chip fwok">FW ' + g.min_fw.toFixed(2) + '+</span>';
}
function starsHTML(g){
  const ds = demoStats(g);
  const full = Math.round(ds.rating);
  return "★".repeat(full) + '<span class="off">' + "☆".repeat(Math.max(0, 5 - full)) + '</span>' +
         ' <span class="cnt">' + ds.rating.toFixed(1) + ' (' + fmtFull(ds.rc) + ' ' + esc(t("ratingsL")) + ')</span> ' + DEMO_TAG;
}
let _badgeCache = null;
function badgeData(){
  if (_badgeCache) return _badgeCache;
  const gs = state.data.games;
  const top = gs.slice().sort((a,b) => effViews(b) - effViews(a))[0];
  _badgeCache = { topId: top ? top.id : null,
    latest: gs.slice().sort((a,b) => (b.added || "").localeCompare(a.added || "")).slice(0,8).map(g => g.id) };
  return _badgeCache;
}
function latestIds(){ return badgeData().latest; }
function badgeHTML(g){
  if ((g.files||[]).some(f => f.kind === "update")) return '<span class="badge upd">' + esc(t("updB")) + '</span>';
  if (badgeData().topId === g.id) return '<span class="badge">🔥 ' + esc(t("trending")) + '</span>';
  if (latestIds().includes(g.id)) return '<span class="badge new">' + esc(t("newB")) + '</span>';
  return "";
}
function cardHTML(g){
  return '<article class="card" style="--gc:' + gameColor(g) + '" data-open="' + g.id + '">' +
    '<div class="cover' + (g.cover ? ' hasimg' : '') + '" style="' + coverStyle(g) + '">' +
      (g.cover ? '<img class="cvimg" src="' + esc(g.cover) + '" alt="" loading="lazy" onerror="this.parentNode.classList.remove(\'hasimg\');this.remove()">' : '') +
      '<span class="chip">' + esc(g.platform) + '</span>' + fwChip(g) + badgeHTML(g) +
      '<span class="mono">' + esc(initials(g.title_en)) + '</span>' +
      '<span class="ct">' + esc(g.title_en) + '</span>' +
      '<span class="ovl"><span class="pill"><span class="st">★</span> ' + demoStats(g).rating.toFixed(1) + ' ' + DEMO_TAG + '</span>' +
      '<span class="pill" data-dl-pill="' + g.id + '">' + dlPillHTML(g) + '</span></span>' +
    '</div>' +
    '<div class="cbody"><div class="t">' + esc(L(g,"title")) + '</div>' +
    '<div class="ta">' + esc(state.lang === "en" ? g.title_ar : g.title_en) + '</div>' +
    '<div class="cmeta">' + (isArabicEd(g) ? '<span class="tag">🌐 <b>AR</b></span>' : "") +
    (g.size && g.size !== "—" ? '<span class="tag">' + esc(t("size")) + ' <b>' + esc(g.size) + '</b></span>' : "") +
    (g.version && g.version !== "—" ? '<span class="tag">' + esc(t("ver")) + ' <b>' + esc(g.version) + '</b></span>' : "") +
    '</div></div></article>';
}
function bindCards(root){
  root.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => { location.hash = "#/game/" + el.getAttribute("data-open"); });
    if (state.data){
      const g = state.data.games.find(x => x.id === el.getAttribute("data-open"));
      if (g) sampleCoverColor(g);
    }
  });
}

<script>
"use strict";
/* ================= click sound — PS1-boot inspired chime =================
   WebAudio synth, NO file. Deep bell-like base (G3 196 Hz) + a two-note
   fifth shimmer (G4 392 Hz → D5 587.33 Hz) with a soft attack and a
   ~180ms bell decay, plus a faint octave sparkle. Lazy context, created
   inside the tap handler (user gesture), wrapped in try/catch. */
let actx = null;
function playChime(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    if (actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime;
    function bell(freq, gainPeak, dur, type){
      const o = actx.createOscillator(); o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gainPeak, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }
    bell(196.00, 0.055, 0.26, "triangle");   /* deep base */
    bell(392.00, 0.075, 0.19);              /* fifth root */
    bell(587.33, 0.05, 0.15);               /* fifth shimmer */
    bell(1174.66, 0.016, 0.09);             /* sparkle */
  }catch(e){}
}

/* ================= theme toggle — circular wipe + chime ================= */
function syncThemeBtn(){
  $("#themeBtn").textContent = state.theme === "dark" ? "☀️" : "🌙";
  const st = $("#sheetTheme");
  if (st) st.textContent = state.theme === "dark" ? "☀️ " + (state.lang === "ar" ? "الوضع النهاري" : "Light mode") : "🌙 " + (state.lang === "ar" ? "الوضع الليلي" : "Dark mode");
}
function applyTheme(){ document.body.classList.toggle("light", state.theme === "light"); syncThemeBtn(); }
function toggleTheme(){
  const next = state.theme === "dark" ? "light" : "dark";
  playChime();
  const apply = () => { state.theme = next; localStorage.setItem("pkgTheme", next); applyTheme(); setTimeout(() => placeBlob(false), 60); };
  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced || !document.startViewTransition){ apply(); return; }
  let x = innerWidth - 40, y = 30;
  const btn = $("#themeBtn");
  if (btn){ const r = btn.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
  try{
    const vt = document.startViewTransition(apply);
    vt.ready.then(() => {
      const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.documentElement.animate(
        { clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + rad + "px at " + x + "px " + y + "px)"] },
        { duration: 600, easing: "cubic-bezier(.22,.9,.28,1)", pseudoElement: "::view-transition-new(root)" });
    }).catch(() => {});
  }catch(e){ apply(); }
}
</script>

<script>

function sectionGames(key){
  const all = state.data.games;

  if (key === "updates") return all.filter(g => (g.files||[]).some(f => f.kind === "update"));
  if (key === "dlc")     return all.filter(g => (g.files||[]).some(f => f.kind === "dlc"));

  return all.filter(g => g.section === key);
}

  if (!key || !state.data) return null;

  const shown = Math.min(state._gshown || 60, list.length);

<script>

/* ================= brand icons — faithful marks, real colors =================
   Unselected icons are greyed by CSS (grayscale + fade); the selected one

let blobX = null;
function renderDock(force){
  const bar = $("#dock"); if (!bar) return;
  const cur = state.platform || "ps";
  if (!force && bar.dataset.cur === cur && bar.dataset.ds === state.dock && bar.querySelectorAll(".dbtn").length === PB_ORDER.length){
    placeBlob(true); return;
  }
  bar.dataset.cur = cur; bar.dataset.ds = state.dock;
  const indInner = state.dock === "05" ? '<span class="orb"><i class="d1"></i><i class="d2"></i></span>'
    : state.dock === "06" ? '<svg viewBox="0 0 64 14" preserveAspectRatio="none" aria-hidden="true"><path d="M0 9 Q8 2.5 16 7.5 T32 7.5 T48 7.5 T64 9 V14 H0 Z" fill="currentColor"/></svg>' : "";
  bar.innerHTML = '<span class="dock-blob noanim" id="dockBlob">' + indInner + '</span>' + PB_ORDER.map(k =>
    '<button type="button" class="dbtn' + (k === cur ? " on" : "") + '" data-pb="' + k + '">' +
    '<span class="pic">' + PB_ICONS[k] + '</span><span class="pl">' + (k === "more" ? esc(pbT("more")) : PB_LABEL[k]) + "</span></button>").join("");
  const nb = $("#dockBlob");

  styleSelTile(nb, cur);
  bar.querySelectorAll("[data-pb]").forEach(b => b.addEventListener("click", () => pbGo(b.getAttribute("data-pb"))));
  if (state.dock === "02") bindMagnet(bar);

}

function placeBlob(anim){
  const bar = $("#dock"), blob = $("#dockBlob");
  if (!bar || !blob) return;
  const btn = bar.querySelector(".dbtn.on");
  if (!btn){ blob.style.opacity = "0"; return; }
  let x = btn.offsetLeft, w = btn.offsetWidth;
  const st = state.dock;
  if (st === "05"){ const nw = 48; x += (w - nw) / 2; w = nw; }
  else if (st === "06"){ const nw = 64; x += (w - nw) / 2; w = nw; }
  else if (st === "10"){ x += 10; w = Math.max(12, w - 20); }
  const glide = anim && blobX !== null;
  blob.classList.remove("noanim");
  if (!glide) blob.classList.add("noanim");
  blob.style.left = x + "px"; blob.style.width = w + "px"; blob.style.opacity = "1";
  if (!glide){ void blob.offsetWidth; blob.classList.remove("noanim"); }
  if (glide && blobX !== x){
    try{
      if (st === "01"){
        const dist = Math.abs(x - blobX);
        const sc = 1 + Math.min(0.45, dist / 240);
        blob.animate([{ transform:"scaleX(1)" }, { transform:"scaleX(" + sc + ")", offset:0.35 }, { transform:"scaleX(1)" }],
          { duration:460, easing:"ease-out" });
      } else if (st === "08"){
        blob.animate([{ transform:"scale(1,1)" }, { transform:"scale(1.16,.8)", offset:0.35 },
                      { transform:"scale(.94,1.1)", offset:0.65 }, { transform:"scale(1,1)" }],
          { duration:520, easing:"ease-out" });
      }
    }catch(e){}
    const pic = btn.querySelector(".pic");
    if (pic) try{ pic.animate(
      [{ transform:"scale(1)" }, { transform:"scale(1.22)", offset:0.4 }, { transform:"scale(1)" }],
      { duration:380, easing:"ease-out" }); }catch(e){}
  }
  blobX = x;
}

function bindMagnet(bar){
  const btns = Array.prototype.slice.call(bar.querySelectorAll(".dbtn"));
  function reset(){ btns.forEach(b => { const p = b.querySelector(".pic"); if (p) p.style.transform = ""; }); }
  bar.addEventListener("pointermove", e => {
    btns.forEach(b => {
      const r = b.getBoundingClientRect();
      const d = Math.abs(e.clientX - (r.left + r.width / 2));
      const s = Math.max(1, 1.38 - (d / 110) * 0.38);
      const p = b.querySelector(".pic");
      if (p) p.style.transform = "scale(" + s.toFixed(3) + ") translateY(" + (-(s - 1) * 7).toFixed(1) + "px)";
    });
  });
  bar.addEventListener("pointerleave", reset);
}

<script>
"use strict";
/* ================= launch wiring — Firestore counters + transition =================
   Counters live in the owner's Firebase project "ai-khor-alzubair",
   collection "pkg_counters", one doc per game id: {views, downloads,
   updated_at}. Accessed ONLY through the Firestore REST API (no SDK, the
   site is static) and WITHOUT any apiKey — the project's rules currently
   allow unauthenticated read + write (verified live 2026-10-29: public
   read of app_config, and an increment commit on a scratch doc succeeded
   and was cleaned up). Every call is wrapped: if Firestore is slow or
   unreachable the page simply keeps its DEMO numbers — counters can never
   break the site.
   Read cost control: counts are fetched in ONE :batchGet POST per chunk of
   100 game ids, only for games actually rendered (plus the demo-top-30
   rail candidates), cached in memory + localStorage, refetched at most
   every 10 minutes per game. */
const FS_DOCS = "https://firestore.googleapis.com/v1/projects/ai-khor-alzubair/databases/(default)/documents";
const FS_PREFIX = "projects/ai-khor-alzubair/databases/(default)/documents/pkg_counters/";
const LIVE_FRESH_MS = 10 * 60 * 1000;
function fsName(id){ return FS_PREFIX + id; }
function fsFetch(url, opts, ms){
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), ms || 7000);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).finally(() => clearTimeout(to));
}
function saveLiveCache(){
  try{
    const slim = {};
    for (const id in LIVE.counts){ const c = LIVE.counts[id]; slim[id] = [c.views, c.downloads, c.exists ? 1 : 0, c.ts]; }
    localStorage.setItem("pkgLiveV1", JSON.stringify(slim));
  }catch(e){}
}
function loadLiveCache(){
  try{
    const raw = JSON.parse(localStorage.getItem("pkgLiveV1") || "{}");
    for (const id in raw){ const a = raw[id]; LIVE.counts[id] = { views: a[0]||0, downloads: a[1]||0, exists: !!a[2], ts: a[3]||0 }; LIVE.fetched[id] = a[3]||0; }
  }catch(e){}
}
async function fsBatchGet(ids){
  const res = await fsFetch(FS_DOCS + ":batchGet", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ documents: ids.map(fsName) }) }, 8000);
  if (!res.ok) throw new Error("batchGet " + res.status);
  const arr = await res.json();
  (arr || []).forEach(item => {
    if (item.found){
      const f = item.found.fields || {};
      const id = item.found.name.split("/").pop();
      LIVE.counts[id] = { views: parseInt((f.views || {}).integerValue || "0", 10),
        downloads: parseInt((f.downloads || {}).integerValue || "0", 10), exists: true, ts: Date.now() };
      LIVE.fetched[id] = Date.now();
    } else if (item.missing){
      LIVE.fetched[item.missing.split("/").pop()] = Date.now();
    }
  });
}
let liveSaveT = null;
function scheduleSave(){ clearTimeout(liveSaveT); liveSaveT = setTimeout(saveLiveCache, 800); }
async function fetchCounts(ids){
  const want = [];
  const seen = {};
  (ids || []).forEach(id => {
    if (!id || seen[id]) return; seen[id] = 1;
    const f = LIVE.fetched[id];
    if (!f || (Date.now() - f) > LIVE_FRESH_MS) want.push(id);
  });
  if (!want.length) return;
  for (let i = 0; i < want.length; i += 100){
    try{
      await fsBatchGet(want.slice(i, i + 100));
      if (!LIVE.ready){ LIVE.ready = true; try{ _badgeCache = null; }catch(e){} }
      paintLive();
      if (!LIVE.railed && LIVE.ready && state.section === "home" && !state.query &&
          !$("#view-home").classList.contains("hidden")){
        LIVE.railed = true; renderHomeBlocks();
      }
      scheduleSave();
    }catch(e){ /* offline / rules changed: DEMO numbers stay, nothing breaks */ }
  }
}
function renderedIds(){
  const out = [];
  document.querySelectorAll("[data-open]").forEach(el => out.push(el.getAttribute("data-open")));
  if (state._gameId) out.push(state._gameId);
  return out;
}
function paintLive(){
  if (!state.data) return;
  if (!LIVE.byId){ LIVE.byId = {}; state.data.games.forEach(g => { LIVE.byId[g.id] = g; }); }
  document.querySelectorAll("[data-dl-pill]").forEach(el => {
    const g = LIVE.byId[el.getAttribute("data-dl-pill")];
    if (g) el.innerHTML = dlPillHTML(g);
  });
  const box = $("#gStatsBox");
  if (box && state._gameId && LIVE.byId[state._gameId]) box.innerHTML = gameStatsHTML(LIVE.byId[state._gameId]);
}
async function fsIncrement(id, field){
  const body = { writes: [{ update: { name: fsName(id),
      fields: { updated_at: { timestampValue: new Date().toISOString() } } },
    updateTransforms: [{ fieldPath: field, increment: { integerValue: "1" } }] }] };
  const res = await fsFetch(FS_DOCS + ":commit", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }, 10000);
  if (!res.ok) throw new Error("commit " + res.status);
  const j = await res.json();
  try{
    const tr = j.writeResults[0].transformResults[0];
    return parseInt(tr.integerValue || "0", 10);
  }catch(e){ return null; }
}
function bumpLocal(id, field, authoritative){
  const c = LIVE.counts[id] || (LIVE.counts[id] = { views: 0, downloads: 0, exists: false, ts: Date.now() });
  if (typeof authoritative === "number") c[field] = authoritative;
  else c[field] = (c[field] || 0) + 1;
  c.exists = true; c.ts = Date.now(); LIVE.fetched[id] = Date.now();
  paintLive(); scheduleSave();
}
const VIEWED_KEY = "pkgViewedV1";
function alreadyViewed(id){
  try{ return (JSON.parse(sessionStorage.getItem(VIEWED_KEY) || "[]")).indexOf(id) >= 0; }catch(e){ return false; }
}
function markViewed(id){
  try{
    const a = JSON.parse(sessionStorage.getItem(VIEWED_KEY) || "[]");
    if (a.indexOf(id) < 0){ a.push(id); sessionStorage.setItem(VIEWED_KEY, JSON.stringify(a.slice(-400))); }
  }catch(e){}
}
function countView(g){
  if (!g) return;
  fetchCounts([g.id]);
  if (alreadyViewed(g.id)) return;
  markViewed(g.id);
  bumpLocal(g.id, "views", null);
  fsIncrement(g.id, "views").then(v => { if (typeof v === "number") bumpLocal(g.id, "views", v); }).catch(() => {});
}
function countDownload(g){
  if (!g) return;
  bumpLocal(g.id, "downloads", null);
  fsIncrement(g.id, "downloads").then(v => { if (typeof v === "number") bumpLocal(g.id, "downloads", v); }).catch(() => {});
}
function initLive(){
  loadLiveCache();
  if (state.data && !LIVE.byId){ LIVE.byId = {}; state.data.games.forEach(g => { LIVE.byId[g.id] = g; }); }
  paintLive();
  const top = state.data.games.slice().sort((a,b) => demoStats(b).views - demoStats(a).views).slice(0, 30).map(g => g.id);
  fetchCounts(top.concat(renderedIds()));
}
/* keep counters flowing as the visitor navigates: after every route change,
   fetch whatever games are now on screen (deduped + freshness-gated). */
const _routeLive = route;
route = function(){ _routeLive(); setTimeout(() => { try{ fetchCounts(renderedIds()); }catch(e){} }, 80); };

/* ================= branded transition → one hop → source ================= */
let tDest = null, tEnableTimer = null;
function closeTransition(){
  $("#tScrim").classList.remove("open");
  if (tEnableTimer){ clearTimeout(tEnableTimer); tEnableTimer = null; }

  $("#tNote").textContent = t("prepNote");

  $("#tCancel").textContent = t("prepCancel");
  const fill = $("#tFill");
  fill.style.transition = "none"; fill.style.width = "0";

  playChime();
  requestAnimationFrame(() => requestAnimationFrame(() => {

    fill.style.width = "100%";
  }));
  tEnableTimer = setTimeout(() => { go.disabled = false; try{ go.focus(); }catch(e){} }, 2400);

$("#tScrim").addEventListener("click", e => { if (e.target === e.currentTarget) closeTransition(); });

<script>
"use strict";
/* ================= liquid pull-to-refresh =================
   Pull down at scroll-top: a viscous droplet stretches from the top with
   springy squash-and-stretch, detaches and bounces while "refreshing"
   (~900ms), then contracts away, re-renders the current view and plays
   the PS1 tick softly. Transform-only (GPU) — no blur loops.
   prefers-reduced-motion: no show, still refreshes. */
(function(){
  const ptr = document.getElementById("ptr");
  if (!ptr) return;
  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let startY = null, eff = 0, refreshing = false;
  const THRESH = 64, MAXP = 120;
  function killAnims(){ try{ ptr.getAnimations().forEach(a => a.cancel()); }catch(e){} }
  function draw(p){
    const sc = Math.min(p / MAXP, 1);
    const y = -44 + p * 0.9;
    ptr.style.opacity = p > 3 ? "1" : "0";
    ptr.style.transform = "translateY(" + y.toFixed(1) + "px) scale(" + (1 - sc * 0.28).toFixed(3) + "," + (1 + sc * 0.75).toFixed(3) + ")";
  }
  function hide(){ ptr.style.opacity = "0"; ptr.style.transform = "translateY(-52px) scale(.6,.6)"; }
  hide();
  window.addEventListener("touchstart", e => {
    if (refreshing) return;
    killAnims(); hide();
    startY = (window.scrollY <= 0 && e.touches.length === 1) ? e.touches[0].clientY : null;
    eff = 0;
  }, { passive:true });
  window.addEventListener("touchmove", e => {
    if (startY === null || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0 && window.scrollY <= 0){ eff = Math.min(dy * 0.55, MAXP); if (!reduced) draw(eff); }
    else { eff = 0; if (!reduced) hide(); }
  }, { passive:true });
  window.addEventListener("touchend", () => {
    if (startY === null) return;
    const go = eff >= THRESH;
    startY = null; eff = 0;
    if (!go){
      if (!reduced && ptr.animate) try{
        ptr.animate([{ transform: ptr.style.transform || "translateY(0px)", opacity: 1 },
                     { transform: "translateY(-52px) scale(.6,.6)", opacity: 0 }],
          { duration: 260, easing: "ease-in", fill: "forwards" });
      }catch(e){}
      setTimeout(() => { killAnims(); hide(); }, 300);
      return;
    }
    refreshing = true;
    ptr.style.opacity = "1";
    if (!reduced && ptr.animate) try{
      ptr.animate([
        { transform: "translateY(" + (-44 + THRESH * 0.9).toFixed(1) + "px) scale(.82,1.5)" },
        { transform: "translateY(30px) scale(1.12,.86)", offset: .45 },
        { transform: "translateY(20px) scale(.94,1.08)", offset: .7 },
        { transform: "translateY(24px) scale(1,1)" }
      ], { duration: 520, easing: "ease-out", fill: "forwards" });
    }catch(e){}
    setTimeout(() => {
      route();
      playChime();
      if (!reduced && ptr.animate) try{
        ptr.animate([
          { transform: "translateY(24px) scale(1,1)", opacity: 1 },
          { transform: "translateY(-52px) scale(.35,.35)", opacity: 0 }
        ], { duration: 380, easing: "ease-in", fill: "forwards" });
      }catch(e){}
      setTimeout(() => { killAnims(); hide(); refreshing = false; }, 430);
    }, 900);
  }, { passive:true });
})();
</script>
